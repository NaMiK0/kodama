services:
  db:
    image: postgres:16
    container_name: kodama-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # ${POSTGRES_PORT} — порт на ХОСТЕ (берётся из .env), 5432 — внутри контейнера.
      # Развели на 5433, чтобы не конфликтовать с другими локальными Postgres.
      - "${POSTGRES_PORT}:5432"
    volumes:
      - kodama-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: kodama-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"     # AMQP — по нему ходят приложения
      - "15672:15672"               # веб-панель управления (http://localhost:15672)
    volumes:
      - kodama-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kodama-redis
    ports:
      - "${REDIS_PORT}:6379"     # 6380 на хосте, чтобы не конфликтовать с booking
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  kodama-pgdata:
  kodama-rabbitmq-data:
