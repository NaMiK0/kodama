services:
  db:
    image: postgres:16
    container_name: kodama-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # ${POSTGRES_PORT} — порт на ХОСТЕ (берётся из .env), 5432 — внутри контейнера.
      # Развели на 5433, чтобы не конфликтовать с другими локальными Postgres.
      - "${POSTGRES_PORT}:5432"
    volumes:
      - kodama-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: kodama-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"     # AMQP — по нему ходят приложения
      - "15672:15672"               # веб-панель управления (http://localhost:15672)
    volumes:
      - kodama-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kodama-redis
    ports:
      - "${REDIS_PORT}:6379"     # 6380 на хосте, чтобы не конфликтовать с booking
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Приложение ──────────────────────────────────────────
  # Три процесса из ОДНОГО образа, отличаются только командой.

  api:
    build: ./backend
    image: kodama-backend:dev
    container_name: kodama-api
    env_file: .env
    environment: &app-env
      # Внутри compose сервисы видят друг друга по ИМЕНИ, а не по localhost.
      # Эти значения перекрывают .env, поэтому локальный запуск не ломается.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIR: /app/uploads
    ports:
      - "8001:8000"   # 8001 на хосте, чтобы не конфликтовать с booking_backend
    volumes:
      - kodama-uploads:/app/uploads
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    image: kodama-backend:dev
    container_name: kodama-worker
    env_file: .env
    environment: *app-env
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: python -m app.worker

  pronunciation-worker:
    build: ./backend
    image: kodama-backend:dev
    container_name: kodama-pronunciation-worker
    env_file: .env
    environment: *app-env
    volumes:
      - kodama-uploads:/app/uploads   # тот же том, что у api: он пишет, воркер читает
      - kodama-models:/cache          # кеш ML-моделей переживает пересборку образа
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    command: python -m app.pronunciation_worker

volumes:
  kodama-pgdata:
  kodama-rabbitmq-data:
  kodama-uploads:
  kodama-models:
