services:
  db:
    image: postgres:16
    container_name: kodama-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # ${POSTGRES_PORT} — порт на ХОСТЕ (берётся из .env), 5432 — внутри контейнера.
      # Развели на 5433, чтобы не конфликтовать с другими локальными Postgres.
      - "${POSTGRES_PORT}:5432"
    volumes:
      - kodama-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  kodama-pgdata:
