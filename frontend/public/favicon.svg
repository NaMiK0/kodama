<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Вариант B: кольца+точка (тот же мотив, что и Logomark.tsx/большой
       маскот, только без фигурки — на 16-32px лицо/ветки/ноги маскота
       сливаются, а разомкнутые кольца держат форму).
       Цвет через @media, не CSS-переменные приложения: фавикон — отдельный
       документ, свои токены сюда не дотягиваются. Следует системной теме,
       не переключателю темы в самом приложении (это два разных сигнала). -->
  <style>
    .mark { fill: #639922; stroke: #639922; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #43b196; stroke: #43b196; }
    }
  </style>
  <g class="mark">
    <circle cx="16" cy="18" r="2.5" />
    <circle
      cx="16" cy="18" r="5" fill="none"
      stroke-width="4" stroke-dasharray="26.61 4.80"
      transform="rotate(-17.5 16 18)"
    />
    <circle
      cx="16" cy="18" r="10" fill="none"
      stroke-width="3" stroke-dasharray="45.38 17.45"
      transform="rotate(5 16 18)"
    />
  </g>
</svg>
