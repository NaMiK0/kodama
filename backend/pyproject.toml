[project]
name = "kodama-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "openai>=2.48.0",
    "openai-whisper>=20250625",
    "pika>=1.4.2",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    # torch объявлен явно (хотя приходит и через whisper/transformers):
    # только для прямых зависимостей работает переопределение источника ниже.
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

# На Linux обычный torch тянет ~3.6 ГБ библиотек CUDA, которые нам не нужны
# (ни локально на Apple Silicon, ни на VPS без видеокарты). Берём CPU-сборку.
# На macOS остаётся штатный torch с PyPI — там CUDA и так нет.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
