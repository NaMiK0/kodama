[project]
name = "kodama-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "openai>=2.48.0",
    "pika>=1.4.2",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
